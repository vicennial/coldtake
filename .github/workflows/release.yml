name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Verify tag, version, and changelog match
        id: version
        run: |
          version=$(uv run python -c 'import coldtake; print(coldtake.__version__)')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
          python3 .github/scripts/release_notes.py "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: uv run --extra dev pytest -q
      - name: Build and check distributions
        run: |
          uv build --out-dir dist
          uv build integrations/omnigent --out-dir dist-omnigent
          uvx twine check --strict dist/* dist-omnigent/*
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            dist-omnigent/
            release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Publish coldtake to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Publish coldtake-omnigent to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-omnigent/
          skip-existing: true

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "coldtake ${{ needs.build.outputs.version }}" \
              --notes-file release-notes.md dist/* dist-omnigent/*
          fi
