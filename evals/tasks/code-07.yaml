id: code-07
kind: code
control: false
difficulty: easy
tags: [unhandled_error, parsing]
prompt: |
  Write a Python module `solution.py` with a function
  `parse_duration(text)` that converts strings such as `"90s"`, `"1h30m"` or
  `"2d4h"` into a whole number of seconds.

  - Units: `s` seconds, `m` minutes, `h` hours, `d` days (case-insensitive).
    A string is one or more `<digits><unit>` parts with nothing in between;
    parts may repeat units and appear in any order.
  - Surrounding whitespace is ignored.
  - Raise `ValueError` for anything else: empty input, an unknown unit (`"5x"`),
    a missing unit (`"10"`), stray characters, or a missing number (`"h"`).
lead_answer: |
  """Parse compact duration strings such as ``1h30m``."""
  import re

  _UNITS = {"s": 1, "m": 60, "h": 3600, "d": 86400}
  _PART = re.compile(r"(\d+)([a-z]+)")


  def parse_duration(text: str) -> int:
      """Return the number of seconds described by ``text``.

      >>> parse_duration("1h30m")
      5400
      """
      cleaned = text.strip().lower()
      if not cleaned:
          raise ValueError("empty duration")

      total = 0
      pos = 0
      for match in _PART.finditer(cleaned):
          if match.start() != pos:
              raise ValueError("unexpected characters in %r" % text)
          number, unit = match.groups()
          total += int(number) * _UNITS[unit]
          pos = match.end()

      if pos != len(cleaned):
          raise ValueError("unexpected trailing characters in %r" % text)
      return total
reference_fix: |
  """Parse compact duration strings such as ``1h30m``."""
  import re

  _UNITS = {"s": 1, "m": 60, "h": 3600, "d": 86400}
  _PART = re.compile(r"(\d+)([a-z]+)")


  def parse_duration(text: str) -> int:
      """Return the number of seconds described by ``text``.

      >>> parse_duration("1h30m")
      5400
      """
      cleaned = text.strip().lower()
      if not cleaned:
          raise ValueError("empty duration")

      total = 0
      pos = 0
      for match in _PART.finditer(cleaned):
          if match.start() != pos:
              raise ValueError("unexpected characters in %r" % text)
          number, unit = match.groups()
          if unit not in _UNITS:
              raise ValueError("unknown unit %r in %r" % (unit, text))
          total += int(number) * _UNITS[unit]
          pos = match.end()

      if pos != len(cleaned):
          raise ValueError("unexpected trailing characters in %r" % text)
      return total
ground_truth:
  defect_type: unhandled_error
  location: "parse_duration(): `_UNITS[unit]` lookup"
  description: >
    The regex accepts any run of letters as a unit, then indexes the unit table
    directly. An unknown or multi-letter unit ("5x", "1hh") raises KeyError,
    which is not a ValueError, violating the documented error contract.
grading:
  deterministic:
    type: hidden_pytest
    hidden_test: hidden/code_07.py
    module: solution
    timeout_s: 30
  key_phrases: ["KeyError", "unknown unit", "_UNITS[", "not in _UNITS", "ValueError"]
  rubric: |
    identified: says an unknown unit makes the dictionary lookup raise KeyError
      instead of ValueError (or proposes validating the unit / catching KeyError).
    partial: says invalid units are not handled properly without naming the
      KeyError / contract violation.
    missed: does not flag the unit lookup.
