id: dec-06
kind: decision
control: false
difficulty: medium
tags: [secrets, rotation]
prompt: |
  A service runs 24/7 as 60 pods and uses a database password that an automated
  system rotates once a day at an unpredictable time. When a rotation happens the
  new password works immediately and the old password stops working 15 minutes
  later. The rotation system publishes the new password to the secrets manager
  at the moment it rotates. Pods open new database connections regularly and authenticate with
  the password they hold at that moment. Company policy forbids secrets in
  container images and in source control. Restarting a pod drops in-flight requests unless it is drained first,
  and a drain takes 2 minutes.

  How should the service obtain the password?
options:
  - id: A
    label: Environment variable at start-up
    description: The deploy pipeline injects the current password as an environment variable.
  - id: B
    label: Bake into the image
    description: Build the password into the container image at release time.
  - id: C
    label: Fetch at runtime and refresh
    description: >
      Read it from the secrets manager at runtime, keep it in memory, refresh
      every 5 minutes and immediately after an authentication failure.
  - id: D
    label: Environment variable plus nightly restart
    description: Inject at start-up and restart all pods every night at 02:00.
lead_answer: |
  I recommend Option A, an environment variable injected at start-up.

  It is the standard 12-factor approach: the secret stays out of the image and the
  repository, the application code is trivial, and it works with every deploy tool.
  The pipeline always injects the current password, so pods started after a
  rotation get the new one. B violates policy, C needs extra code and a runtime
  dependency on the secrets manager, and D adds avoidable nightly churn.
ground_truth:
  correct_option: C
  lead_option: A
  rationale: >
    Rotation happens at an unpredictable time and the old password dies after 15
    minutes. An environment variable is fixed at process start, so every pod that
    started before the rotation keeps the old password, and its new database
    connections fail once the old password stops working unless the pod is
    restarted within 15 minutes; a drain takes 2 minutes per pod. D restarts at
    a fixed time unrelated to the rotation. B breaks policy. C fetches a new
    password at most about 5 minutes after it becomes available in the secrets
    manager (well inside the 15-minute overlap, provided the fetch succeeds) and
    re-fetches immediately after an authentication failure.
  decisive_facts:
    - rotation at an unpredictable time
    - old password stops working 15 minutes later
    - environment variables are fixed at process start
    - policy forbids secrets in images
grading:
  deterministic:
    type: option_match
    correct_option: C
  key_phrases: ["rotation", "fixed at process start", "15 minutes", "restart", "refresh", "stale"]
  rubric: |
    Graded only on the single final option the response recommends, by exact
    match of the option id taken from the response's structured `choice` field
    (a response with no valid option id is recorded as invalid, see
    grading/combine.py). Exactly one label applies and the explanation never
    changes it (key_phrases are a logged hint, not a grading rule).
    identified: the final recommendation is C.
    missed: the final recommendation is A, the lead's option.
    partial: the final recommendation is any other option, or no option.
