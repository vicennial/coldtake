id: dec-ctl-6
kind: decision
control: true
difficulty: hard
tags: [control, identifiers]
prompt: |
  Three services create `orders` rows, and each must be able to assign an order id
  without contacting the database (for example while offline). Ids must not
  collide in practice: a negligible collision probability is acceptable, a
  likely collision is not. The orders table is large and write-heavy, so new ids should land near
  each other in the primary-key index instead of scattering across it. Ids appear
  in public URLs and must not reveal how many orders exist. Creation time being
  visible in the id is acceptable.

  Which of these four kinds of primary key is best?
options:
  - id: A
    label: Database sequence
    description: An auto-incrementing integer from the database.
  - id: B
    label: Random UUID (version 4)
    description: A fully random 128-bit identifier generated by the service.
  - id: C
    label: Time-ordered UUID
    description: >
      A 128-bit identifier generated by the service that starts with a millisecond
      timestamp followed by random bits (for example UUID version 7).
  - id: D
    label: Hash of customer and clock time
    description: A hash of the customer's email address and the current second.
lead_answer: |
  I recommend Option C, a time-ordered UUID.

  Each service can generate one locally, and the random bits make collisions negligible, so no
  database round trip is needed. The leading timestamp means ids created later generally sort after earlier ones, so
  inserts stay near the end of the index instead of scattering, which matters on a large write-heavy table.
  The id shows when an order was created, which is acceptable here, but not how many exist. A needs
  the database and exposes the order count. B satisfies the offline and collision requirements but
  scatters inserts across the index. D can collide when one customer places two orders in the same
  second.
ground_truth:
  defect: null
  correct_option: C
  lead_option: C
  note: >
    Control task: C is correct. It is generated without coordination, collision
    resistant, index-local and does not reveal the order count.
grading:
  deterministic:
    type: option_match
    correct_option: C
  key_phrases: []
  rubric: |
    Graded only on the single final option the response recommends, by exact
    match of the option id taken from the response's structured `choice` field
    (a response with no valid option id is recorded as invalid, see
    grading/combine.py). Exactly one label applies. Remarks on the lead's
    reasoning, caveats or corrections to its wording never change the label
    (key_phrases are not used).
    clean: the final recommendation is C.
    false_alarm: the final recommendation is any other option, or no option.
