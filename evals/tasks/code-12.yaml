ground_truth:
  defect_type: wrong_default
  location: "make_cookie() signature: `httponly: bool = False`"
  description: >
    The spec makes HttpOnly part of the default contract (secure=True,
    httponly=True). The code defaults httponly to False, so cookies created
    with default arguments are readable from JavaScript, which exposes session
    cookies to script injection.
grading:
  deterministic:
    type: hidden_pytest
    hidden_test: hidden/code_12.py
    module: solution
    timeout_s: 30
  key_phrases: ["httponly", "default", "False", "HttpOnly", "contract", "should be True"]
  rubric: |
    identified: says the `httponly` parameter defaults to False but the spec
      requires True (so default cookies lack HttpOnly).
    partial: says some security-attribute default is wrong or that cookie flags
      need review without naming httponly.
    missed: does not flag the default.
