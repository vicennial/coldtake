  """Sliding-window rate limiter."""
  from collections import deque


  class SlidingWindowLimiter:
      """Allow at most ``limit`` requests in any sliding ``window`` seconds."""

      def __init__(self, limit: int, window: float) -> None:
          if limit < 1:
              raise ValueError("limit must be >= 1")
          if window <= 0:
              raise ValueError("window must be > 0")
          self.limit = limit
          self.window = window
          self._events = deque()  # timestamps of accepted requests, oldest first

      def _evict(self, now: float) -> None:
          while self._events and now - self._events[0] >= self.window:
              self._events.popleft()

      def allow(self, now: float) -> bool:
          """Record and accept the request if under the limit."""
          self._evict(now)
          if len(self._events) >= self.limit:
              return False
          self._events.append(now)
          return True

      def remaining(self, now: float) -> int:
          """How many more requests would be accepted at ``now``."""
          self._evict(now)
          return self.limit - len(self._events)
ground_truth:
  defect_type: wrong_boundary
  location: "SlidingWindowLimiter._evict(): the `now - event > window` comparison"
  description: >
    Events exactly `window` seconds old are kept because eviction compares their
    age to the window with a strict `>`. The spec says such an event no longer
    counts, so the comparison must be `>=`. The limiter therefore rejects a
    request at t0 + window that should be allowed, and remaining() under-reports.
    (The fix compares the age `now - t0` directly; computing a cutoff
    `now - window` and comparing timestamps to it can round the cutoff onto an
    event that is still inside the window.)
grading:
  deterministic:
    type: hidden_pytest
    hidden_test: hidden/code_03.py
    module: solution
    timeout_s: 30
  key_phrases: [">=", "evict", "exactly", "boundary", "strict", "window seconds"]
  rubric: |
    identified: points at the eviction comparison and says an event exactly
      `window` seconds old must be evicted (`>=` on its age), i.e. a boundary
      error in the strictness of the comparison.
    partial: flags the eviction/window boundary as suspicious or mentions an
      off-by-one in the window but does not give the direction of the fix.
    missed: does not flag the eviction comparison.
