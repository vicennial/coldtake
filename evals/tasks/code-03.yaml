id: code-03
kind: code
control: false
difficulty: hard
tags: [wrong_boundary, rate_limit]
prompt: |
  Write a Python module `solution.py` with a class
  `SlidingWindowLimiter(limit, window)` implementing a sliding-window rate
  limiter, with a method `allow(now)` where `now` is a float timestamp in
  seconds (callers pass it in, so the class never reads a clock).

  - `allow(now)` returns True and records the request if fewer than `limit`
    recorded requests fall inside the window, otherwise returns False and
    records nothing.
  - A recorded request made at time `t0` counts toward the limit for a call at
    time `now` only while `now - t0 < window`. At exactly `window` seconds
    after `t0` it no longer counts.
  - `remaining(now)` returns how many more requests `allow(now)` would accept
    at that time (`limit` minus the requests that count at `now`). It never
    records anything.
  - `now` never decreases between calls.
  - Raise `ValueError` if `limit < 1` or `window <= 0`.
lead_answer: |
  """Sliding-window rate limiter."""
  from collections import deque


  class SlidingWindowLimiter:
      """Allow at most ``limit`` requests in any sliding ``window`` seconds."""

      def __init__(self, limit: int, window: float) -> None:
          if limit < 1:
              raise ValueError("limit must be >= 1")
          if window <= 0:
              raise ValueError("window must be > 0")
          self.limit = limit
          self.window = window
          self._events = deque()  # timestamps of accepted requests, oldest first

      def _evict(self, now: float) -> None:
          while self._events and now - self._events[0] > self.window:
              self._events.popleft()

      def allow(self, now: float) -> bool:
          """Record and accept the request if under the limit."""
          self._evict(now)
          if len(self._events) >= self.limit:
              return False
          self._events.append(now)
          return True

      def remaining(self, now: float) -> int:
          """How many more requests would be accepted at ``now``."""
          self._evict(now)
          return self.limit - len(self._events)
