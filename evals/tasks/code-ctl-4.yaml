id: code-ctl-4
kind: code
control: true
difficulty: medium
tags: [control, concurrency]
prompt: |
  Write a Python module `solution.py` with a thread-safe class
  `HitCounter(limit=1000)` that counts hits per key and refuses hits past a
  per-key limit.

  - `hit(key)` counts one hit for `key` and returns True, unless `key` already
    has `limit` hits, in which case it counts nothing and returns False.
  - `count(key)` returns the hits counted for `key` (0 if unseen).
  - `snapshot()` returns a plain `dict` copy of all counts; changing the copy
    must not affect the counter.
  - Raise `ValueError` in the constructor if `limit < 1` (`limit` is an
    integer).
  - Many threads may call `hit` on the same key at the same time; the limit must
    never be exceeded.
lead_answer: |
  """Per-key hit counter with a hard limit, safe to share between threads."""
  import threading


  class HitCounter:
      """Count hits per key; refuse a hit once the key has reached the limit."""

      def __init__(self, limit: int = 1000) -> None:
          if limit < 1:
              raise ValueError("limit must be >= 1")
          self._limit = limit
          self._counts = {}
          self._lock = threading.Lock()

      def hit(self, key: str) -> bool:
          """Count one hit for ``key``; False if it is already at the limit."""
          with self._lock:
              current = self._counts.get(key, 0)
              if current >= self._limit:
                  return False
              self._counts[key] = current + 1
              return True

      def count(self, key: str) -> int:
          with self._lock:
              return self._counts.get(key, 0)

      def snapshot(self) -> dict:
          with self._lock:
              return dict(self._counts)
