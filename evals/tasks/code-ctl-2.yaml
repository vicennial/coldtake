id: code-ctl-2
kind: code
control: true
difficulty: medium
tags: [control, rate_limit]
prompt: |
  Write a Python module `solution.py` with a class `TokenBucket(rate, capacity,
  now=0.0)` that limits operations with a token bucket.

  - The bucket starts full with `capacity` tokens at time `now`. It refills
    continuously at `rate` tokens per second but never holds more than
    `capacity`.
  - `try_consume(now, n=1)` first credits the tokens earned since the last
    call, then removes `n` tokens and returns True if at least `n` are
    available, otherwise removes nothing and returns False.
  - If `now` is earlier than a time already seen, treat it as no time having
    passed (never refill backwards and never move the internal clock back).
  - `available()` returns the number of tokens held as of the last
    `try_consume` call (a float; `capacity` before any call). It credits no
    time and changes nothing.
  - Raise `ValueError` in the constructor if `rate <= 0` or `capacity < 1`, and
    in `try_consume` if `n < 1` or `n > capacity`.
  - Timestamps and rates are ordinary finite numbers of normal size (no
    overflow concerns).
lead_answer: |
  """Token bucket rate limiter with caller-supplied time."""


  class TokenBucket:
      """Refill continuously, spend whole tokens."""

      def __init__(self, rate: float, capacity: float, now: float = 0.0) -> None:
          if rate <= 0:
              raise ValueError("rate must be > 0")
          if capacity < 1:
              raise ValueError("capacity must be >= 1")
          self.rate = float(rate)
          self.capacity = float(capacity)
          self._tokens = float(capacity)
          self._last = float(now)

      def _refill(self, now: float) -> None:
          if now > self._last:
              earned = (now - self._last) * self.rate
              self._tokens = min(self.capacity, self._tokens + earned)
              self._last = now

      def try_consume(self, now: float, n: int = 1) -> bool:
          """Take ``n`` tokens if available."""
          if n < 1 or n > self.capacity:
              raise ValueError("n must be between 1 and capacity")
          self._refill(now)
          if self._tokens >= n:
              self._tokens -= n
              return True
          return False

      def available(self) -> float:
          """Tokens currently in the bucket (as of the last call)."""
          return self._tokens
