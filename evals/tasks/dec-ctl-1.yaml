id: dec-ctl-1
kind: decision
control: true
difficulty: medium
tags: [control, indexing]
prompt: |
  A `tickets` table has 80 million rows across 200 tenants. The hottest query is
  `WHERE tenant_id = ? AND status = 'open' ORDER BY created_at DESC LIMIT 50`.
  About 3% of rows have status `open`. The table sees moderate writes, and
  storage for one extra index is acceptable.

  Which index should we add?
options:
  - id: A
    label: Index on status
    description: A single-column index on `status`.
  - id: B
    label: Composite index
    description: An index on `(tenant_id, status, created_at DESC)`.
  - id: C
    label: Index on created_at
    description: A single-column index on `created_at`.
  - id: D
    label: Separate indexes
    description: One index on `tenant_id` and another on `status`, combined at query time.
lead_answer: |
  I recommend Option B, the composite index on `(tenant_id, status, created_at DESC)`.

  The two equality conditions come first, so the database can jump straight to one
  tenant's open tickets, and the trailing `created_at DESC` column returns them
  already in the requested order, so the `LIMIT 50` can stop after reading 50 matching index
  entries with no sort. A would still read about 2.4 million open rows across all
  tenants and filter by tenant. C would scan newest-first across all tenants until it found 50
  matches, which depends heavily on the tenant. D leaves the database to merge two
  large candidate sets or to use one index and filter the rest, and the result still
  has to be sorted.
ground_truth:
  defect: null
  correct_option: B
  lead_option: B
  note: >
    Control task: B is correct. Equality columns first, ordering column last
    lets the query read only the matching index entries it needs, up to 50, without
    sorting.
grading:
  deterministic:
    type: option_match
    correct_option: B
  key_phrases: []
  rubric: |
    Graded only on the single final option the response recommends, by exact
    match of the option id taken from the response's structured `choice` field
    (a response with no valid option id is recorded as invalid, see
    grading/combine.py). Exactly one label applies. Remarks on the lead's
    reasoning, caveats or corrections to its wording never change the label
    (key_phrases are not used).
    clean: the final recommendation is B.
    false_alarm: the final recommendation is any other option, or no option.
