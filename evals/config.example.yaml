# Example run configuration. Copy and edit; pass with --config.
# Model ids and efforts are placeholders: set them for the real run.

# The family each lead answer is *attributed to*. The lead answers in the corpus
# are authored, not generated by a model; "self review" therefore means "the
# advisor is of the lead's nominal family". Running both families gives two
# mirrored sets of cells.
lead_families: [family_a, family_b]

families:
  family_a:
    model: SET_ME
    effort: SET_ME
  family_b:
    model: SET_ME
    effort: SET_ME

# Graders. For an advisor of family X the harness uses a grader of a different
# family, so a model never grades its own output.
graders:
  family_a: {model: SET_ME}
  family_b: {model: SET_ME}

# "neutral": review prompts present the answer as written by a colleague, in
# both review conditions. "own": the self-review condition says "this is your
# earlier answer". The default isolates the family effect.
self_framing: neutral
